[project]
name = "tide-trader-core"
version = "0.1.0"
description = "Realtime trading backend: Alpaca gateway, risk manager, and REST/WebSocket API for Tide Trader"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "alpaca-py>=0.33.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "httpx>=0.27.0",
  "pytest-cov>=7.1.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
