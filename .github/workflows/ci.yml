name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests (Python, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check app

      - name: Security scan (Bandit)
        run: uv run bandit -r app

      - name: Dependency vulnerability scan (pip-audit)
        run: uv run pip-audit

      - name: Run tests with coverage
        run: uv run pytest --cov=app --cov-report=term-missing

      - name: Smoke test (boot the real backend, check auth + token permissions)
        run: uv run python scripts/smoke_test.py

  frontend-build:
    name: Frontend tests + typecheck + build (Electron, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run allowed install scripts (LavaMoat)
        run: npm run allow-scripts

      - name: Lint
        run: npm run lint

      - name: Dependency vulnerability scan (npm audit)
        run: npm audit --omit=dev --audit-level=high

      - name: Run tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Smoke test (launch the built Electron app)
        if: runner.os == 'Windows'
        run: node scripts/electron-smoke.mjs
